spring:
  application:
    name: customer-service
  
  data:
    mongodb:
      database: customer_service_db
      
  cloud:
    stream:
      bindings:
        banking-notifications-out-0:
          destination: banking-notifications
          content-type: application/json
        audit-events-out-0:
          destination: audit-events
          content-type: application/json
        fraud-alerts-out-0:
          destination: fraud-alerts
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true

server:
  port: 8081

business:
  rules:
    unique-document: true
    validate-email: true
    validate-phone: true
    max-customers-per-day: 100

eureka:
  client:
    service-url:
      defaultZone: http://eureka-user:eureka-password@localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    root: INFO
    com.bank.customerservice: DEBUG
